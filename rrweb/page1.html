<!DOCTYPE html>
<html lang="en">
<head>
    <title>Host: Page 1</title>
    <script src="./rrweb.min.js"></script>
    <style>
        body { margin: 0; font-family: sans-serif; padding-top: 60px; background: #fdfdfd; }
        .toolbar { position: fixed; top: 0; left: 0; width: 100%; background: #333; padding: 15px; color: white; display: flex; gap: 20px; align-items: center; }
        .content { max-width: 600px; margin: 0 auto; padding: 20px; }
        .block { height: 400px; margin-bottom: 20px; background: #eee; border: 2px dashed #ccc; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #666; }
        button { background: #00ff88; border: none; padding: 8px 16px; cursor: pointer; font-weight: bold; }
        a { color: #00ff88; }
    </style>
</head>
<body>
    <div class="toolbar">
        <strong>Host: Page 1</strong>
        <button onclick="syncData()">Sync to Viewer</button>
        <a href="page2.html">Go to Page 2 ➔</a>
    </div>

    <div class="content">
        <h1>Welcome to the Long Page 1</h1>
        <p>Scroll down to see the different blocks.</p>
        <div class="block">Block A: The Top</div>
        <div class="block">Block B: The Middle</div>
        <div class="block">Block C: Keep Going</div>
        <div class="block">Block D: The Bottom</div>
    </div>

    <script>
        let events = [];
        rrweb.record({
            emit(event) {
                // Ignore mouse (1) and scroll (2) to allow independent viewer scrolling
                if (event.type === 3 && (event.data.source === 1 || event.data.source === 2)) return;
                events.push(event);
            }
        });

        function syncData() {
            localStorage.setItem('rrweb_sandbox', JSON.stringify(events));
            console.log("Synced!");
        }
        
        // Auto-sync once on initial load so the viewer sees it immediately
        setTimeout(syncData, 500); 
    </script>
</body>
</html>
